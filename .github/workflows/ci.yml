name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: pip install -e ".[dev]"
      - run: black --check .
      - run: ruff check . --ignore B008
      - run: pytest -m "not integration"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m venv wheel-venv
      - run: wheel-venv/bin/python -m pip install --upgrade pip
      - run: wheel-venv/bin/python -m pip install dist/*.whl
      - run: wheel-venv/bin/python scripts/wheel_smoke.py
      - run: wheel-venv/bin/amo --help

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Scan the current repository snapshot
        run: >-
          docker run --rm
          -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          dir --redact --verbose --no-banner /repo

  integration:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      source-db:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: source
          POSTGRES_PASSWORD: source
          POSTGRES_DB: sourcedb
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U source -d sourcedb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      target-db:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: target
          POSTGRES_PASSWORD: target
          POSTGRES_DB: targetdb
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U target -d targetdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: pip install -e ".[dev]"
      - run: pytest -m integration tests/integration -q
        env:
          AMO_RUN_INTEGRATION: "1"
