services:
  source-db:
    image: postgres:15-alpine
    container_name: agentic-source-db
    environment:
      POSTGRES_USER: source
      POSTGRES_PASSWORD: source
      POSTGRES_DB: sourcedb
    ports:
      - "${SOURCE_DB_PORT:-5433}:5432"
    volumes:
      - ./seed:/docker-entrypoint-initdb.d
      - source_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U source -d sourcedb"]
      interval: 10s
      timeout: 5s
      retries: 5

  target-db:
    image: postgres:15-alpine
    container_name: agentic-target-db
    environment:
      POSTGRES_USER: target
      POSTGRES_PASSWORD: target
      POSTGRES_DB: targetdb
    ports:
      - "${TARGET_DB_PORT:-5434}:5432"
    volumes:
      - target_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U target -d targetdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic-migrator
    environment:
      SRC_HOST: source-db
      SRC_PORT: 5432
      SRC_USER: source
      SRC_PASSWORD: source
      SRC_DB: sourcedb
      DST_HOST: target-db
      DST_PORT: 5432
      DST_USER: target
      DST_PASSWORD: target
      DST_DB: targetdb
    depends_on:
      source-db:
        condition: service_healthy
      target-db:
        condition: service_healthy
    ports:
      - "8501:8501"
    volumes:
      - ./runs:/app/runs

volumes:
  source_data:
  target_data:
