[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-db-migrator"
version = "0.3.0"
description = "AI-driven database migration orchestrator"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name="Atul Kushwaha" }]
requires-python = ">=3.10"

dependencies = [
    "psycopg2-binary",
    "pydantic>=2",
    "pyyaml",
    "typer",
    "python-dotenv",
    "rich",
    "google-genai",
    "openai",
    "mcp"
]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff", "isort", "build", "twine"]
ui = ["streamlit"]

[project.scripts]
amo = "amo.cli:app"
amo-mcp = "amo.mcp_server:main"

[tool.setuptools.package-data]
"amo.core.planners" = ["prompts/*.md"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
markers = [
    "integration: requires isolated source and target PostgreSQL instances",
]
